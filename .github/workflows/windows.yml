name: Windows build and installation verification
on:
  push:
    branches: [main, build/windows-security-stack, feature/section-e-access-security]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - name: Build, test, and compile installer
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Install, exercise, upgrade, and uninstall
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Dependency vulnerability inventory
        if: always()
        shell: pwsh
        run: dotnet list OTS.Firewall79X.sln package --vulnerable --include-transitive --format json | Out-File artifacts/vulnerability-report.json
      - name: Enforce dependency gate and include test evidence
        shell: pwsh
        run: ./scripts/finalize.ps1
      - name: Verify real Windows setup executable, checksum, and release ZIP contents
        shell: pwsh
        run: ./scripts/verify-distribution.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: OTS-Firewall79X-Windows-x64
          path: |
            artifacts/release/
            artifacts/*test-results.json
            artifacts/windows-observed-status.json
            artifacts/vulnerability-report.json
            artifacts/*.log
            artifacts/ui/
            artifacts/ui-preflight/
          if-no-files-found: error
          retention-days: 30

  development-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: false
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: OTS-Firewall79X-Windows-x64
          path: downloaded
      - name: Synchronize tested installer and checksum into installer/ (Git LFS)
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/release/OTS-Firewall79X-Setup.exe
          test -s downloaded/release/OTS-Firewall79X-Setup.exe.sha256
          git lfs install --local
          test "$(git check-attr filter -- installer/OTS-Firewall79X-Setup.exe)" = "installer/OTS-Firewall79X-Setup.exe: filter: lfs"
          cp downloaded/release/OTS-Firewall79X-Setup.exe installer/OTS-Firewall79X-Setup.exe
          cp downloaded/release/OTS-Firewall79X-Setup.exe.sha256 installer/OTS-Firewall79X-Setup.exe.sha256
          ( cd installer && sha256sum --check OTS-Firewall79X-Setup.exe.sha256 )
          git add -- installer/OTS-Firewall79X-Setup.exe installer/OTS-Firewall79X-Setup.exe.sha256
          git lfs ls-files | grep -F 'installer/OTS-Firewall79X-Setup.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize verified Windows installer [skip ci]'
            git push origin HEAD:refs/heads/main
          fi
      - name: Publish verified development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v0.1.0-preview.${GITHUB_RUN_NUMBER}" downloaded/release/* \
            --target "$RELEASE_COMMIT" --prerelease \
            --title "OTS Firewall79X 0.1.0 — incomplete development preview" \
            --notes-file downloaded/release/RELEASE_NOTES.md
