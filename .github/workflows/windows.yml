name: Windows build and installation verification
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      OTS_RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/main' && vars.OTS_RELEASE_CHANNEL || 'preview' }}
      OTS_SIGNING_CERT_SHA256: ${{ vars.OTS_SIGNING_CERT_SHA256 }}
      OTS_CODESIGN_PFX_BASE64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OTS_CODESIGN_PFX_BASE64 || '' }}
      OTS_CODESIGN_PFX_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.OTS_CODESIGN_PFX_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.403'
      - name: Build, test, and compile installer
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Install, exercise, upgrade, and uninstall
        shell: pwsh
        run: ./scripts/windows-smoke.ps1
      - name: Dependency vulnerability inventory
        if: always()
        shell: pwsh
        run: dotnet list OTS.Firewall79X.sln package --vulnerable --include-transitive --format json | Out-File artifacts/vulnerability-report.json
      - name: Enforce dependency gate and include test evidence
        shell: pwsh
        run: ./scripts/finalize.ps1
      - name: Verify real Windows setup executable, checksum, and release ZIP contents
        shell: pwsh
        run: ./scripts/verify-distribution.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: OTS-Firewall79X-Windows-x64
          path: |
            artifacts/release/
            artifacts/*test-results.json
            artifacts/windows-observed-status.json
            artifacts/vulnerability-report.json
            artifacts/*.log
            artifacts/ui/
            artifacts/ui-preflight/
          if-no-files-found: error
          retention-days: 1

  development-release:
    # Never upload large installers to Git LFS automatically.
    # Only an authorized, explicit manual run publishes a GitHub prerelease.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download fully verified Windows distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: OTS-Firewall79X-Windows-x64
          path: downloaded
      - name: Publish explicitly requested preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/release/OTS-Firewall79X-Setup.exe
          test -s downloaded/release/OTS-Firewall79X-Setup.exe.sha256
          ( cd downloaded/release && sha256sum --check OTS-Firewall79X-Setup.exe.sha256 )
          gh release create "v0.1.0-preview.${GITHUB_RUN_NUMBER}" downloaded/release/* \
            --target "$RELEASE_COMMIT" --prerelease \
            --title "OTS Firewall79X 0.1.0 — incomplete development preview" \
            --notes-file downloaded/release/RELEASE_NOTES.md
